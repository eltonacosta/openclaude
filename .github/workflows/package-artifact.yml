# Build and upload the installable `.tgz` package artifact.
name: Package artifact

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-artifact:
    name: Build .tgz artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Pack tarball
        run: |
          set -euo pipefail
          mkdir -p artifact
          npm pack --ignore-scripts --json --pack-destination=./artifact --loglevel=error > pack.json
          FILENAME="$(node -p "require('./pack.json')[0].filename")"
          VERSION="$(node -p "require('./package.json').version")"
          mv "./artifact/${FILENAME}" "./artifact/openclaude-${VERSION}.tgz"

      - name: Upload tarball artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: openclaude-tgz
          path: ./artifact/openclaude-*.tgz
          if-no-files-found: error
          retention-days: 30
