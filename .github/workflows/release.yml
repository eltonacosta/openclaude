# Auto Release: on every push to main, if package.json.version advanced to a
# version that has no tag yet, build + validate the installable .tgz on all
# supported OS, and only then create the unique monotonic vX.Y.Z tag and
# publish a GitHub Release with the .tgz attached as a durable asset.
#
# No npm publishing: GitHub Releases is the single distribution point.
#
# Why not a tag-push trigger for the artifact build? A tag created by
# GITHUB_TOKEN does not start workflows with `on: push: tags`, so the build
# must happen in this same run, BEFORE the tag exists. package-artifact.yml is
# invoked here via workflow_call and keeps its manual `workflow_dispatch`
# trigger for on-demand test builds (which never create tags/releases).
name: Auto Release

on:
  push:
    branches:
      - main

concurrency:
  group: auto-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  detect:
    if: ${{ github.repository == 'eltonacosta/openclaude' }}
    name: Detect release version
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Compute release decision
        id: check
        run: |
          set -euo pipefail

          VERSION="$(node -p "require('./package.json').version")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          TAG="v${VERSION}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          # Strict X.Y.Z only (no prerelease/build suffixes) for release tags.
          if ! [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){2}$ ]]; then
            echo "::warning::package.json version '${VERSION}' is not a strict X.Y.Z — skipping release"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Never reuse an existing tag: the same version must not be released twice.
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q .; then
            echo "::warning::Tag ${TAG} already exists — skipping release"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The version must be strictly greater than every existing release tag.
          LATEST="$(git ls-remote --tags origin 'refs/tags/v*' \
            | sed -n 's#.*refs/tags/v##p' \
            | sed 's#\^{}$##' \
            | sort -V \
            | tail -n 1 || true)"
          if [[ -n "$LATEST" ]] && ! sort -V -C <(printf '%s\n' "${LATEST}" "${VERSION}"); then
            echo "::warning::Version ${VERSION} is not newer than the latest release tag ${LATEST} — skipping release"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "::notice::New release detected: ${TAG} (current latest: ${LATEST:-none})"

  # Builds the .tgz and verifies it installs cleanly on Linux / macOS / Windows
  # × Node 22 / 24 (package-artifact.yml, invoked here). No tag exists yet —
  # the whole run releases nothing until every check passes.
  artifact:
    name: Build & verify .tgz (all OS)
    needs: detect
    if: ${{ needs.detect.outputs.should_release == 'true' }}
    uses: ./.github/workflows/package-artifact.yml

  release:
    name: Publish GitHub Release
    needs: [detect, artifact]
    if: ${{ needs.detect.outputs.should_release == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download tarball
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: openclaude-tgz
          path: ./openclaude-tgz

      - name: Create tag + release and upload tarball
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ needs.detect.outputs.tag }}"
          TGZ="$(ls ./openclaude-tgz/*.tgz | head -n 1)"
          # gh release create also creates the lightweight tag (pointing at the
          # pushed commit) when it does not exist yet.
          NOTES="Installable artifact: \`npm install -g ${TGZ}\` (asset below).
          Built and verified on Linux/macOS/Windows × Node 22/24 by CI."
          gh release create "${TAG}" "${TGZ}" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "${TAG}" \
            --notes "${NOTES}"
          echo "Released ${TAG} with ${TGZ}"

  docker:
    name: Build & Push Docker Image
    needs: [detect, release]
    if: ${{ needs.detect.outputs.should_release == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: v${{ needs.detect.outputs.version }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c6544345570f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.detect.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.detect.outputs.version }}
            type=raw,value=latest

      - name: Build and load locally
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          load: true
          tags: openclaude:smoke
          cache-from: type=gha

      - name: Smoke test
        run: docker run --rm openclaude:smoke --version

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max